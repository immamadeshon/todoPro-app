<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./css/styles.css" />
  <title>TODO App</title>
</head>

<body >
  <header class="card">
    <h1>لیست وظایف </h1>
    
  </header>
  <main>
    <div class="card add">
      <div class="cb-container">
        <button id="add-btn">+</button>
      </div>
      <div class="txt-container">
        <label for="addt">افزودن </label>
        <input type="text" class="txt-input" placeholder="افزودن وظیفه جدید..." s
          id="addt" dir="rtl" />
      </div>
    </div>
    <ul class="todos">

      <!-- <li class="card">
        <div class="cb-container">
          <input type="checkbox" class="cb-input" />
          <span class="check"></span>
        </div>
        <p class="item">یادگیری جاوااسکریپت</p>
        <button class="clear">
          <img src="./assets/images/icon-cross.svg" alt="Clear it" />
        </button>
      </li> -->
      
    </ul>
    
    <div class="card stat">
      <p class="corner"><span id="items-left">0</span> مورد باقی مانده</p>
      <div class="filter">
        <button id="all" class="on">همه</button>
        <button id="active" >فعال</button>
        <button id="completed">تکمیل</button>
      </div>
      <div class="corner">
        <button id="clear-completed">حذف تکمیل شده ها</button>
      </div>
    </div>

  </main>
  <script src="./js/scripts.js"></script>
</body>

</html>
